name: Test on Ubuntu / macOS / Windows Git Bash

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os.name }}
    strategy:
      matrix:
        os:
          - name: Ubuntu
            suffix: ubuntu
            runner: ubuntu-latest
          - name: macOS
            suffix: macos
            runner: macos-latest
          - name: Windows Git Bash
            suffix: windows-gitbash
            runner: windows-latest
      fail-fast: false
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/
        with:
          artifact-suffix: ${{ format('-{0}', matrix.os.suffix) }}
          shell: bash
          kcov: true
