name: Windows MSYS2 Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows MSYS2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - id: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Set up environment
        run: |
          echo "MSYSTEM=UCRT64" >> "$GITHUB_ENV"
          echo "MSYS2_PATH_TYPE=minimal" >> "$GITHUB_ENV"
          echo "$MSYS2_LOCATION/usr/bin" >> "$GITHUB_PATH"
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.setup-msys2.outputs.msys2-location }}
      - uses: $/
        with:
          artifact-suffix: "-windows-msys2"
          shell: bash
          kcov: true
